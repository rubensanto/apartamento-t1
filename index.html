<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Apartamento T1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table tool. Header strip, a framed 3D sheet (the apartment) and an instrument panel to its right; stacks on phones. */
:root{
  --bg:#E7EAE5; --surface:#F6F7F3; --stage:#D6DCD6; --ink:#1A211F; --muted:#59645F; --line:#C5CDC7;
  --accent:#2747C7; --accent-ink:#FFFFFF; --accent-soft:rgba(39,71,199,.10);
  --bad:#BE3328; --bad-soft:rgba(190,51,40,.10); --warn:#B25A07; --warn-soft:rgba(178,90,7,.12);
  --good:#2E764A; --good-soft:rgba(46,118,74,.12);
  --on-floor:#2B2118; /* labels drawn over the oak floor, same in both themes */
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A1F1D; --stage:#0E1211; --ink:#E3E8E5; --muted:#93A09A; --line:#2D3532;
  --accent:#8FA3FF; --accent-ink:#0C1233; --accent-soft:rgba(143,163,255,.14);
  --bad:#F2766B; --bad-soft:rgba(242,118,107,.14); --warn:#F5A35C; --warn-soft:rgba(245,163,92,.14);
  --good:#6FCB95; --good-soft:rgba(111,203,149,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A1F1D; --stage:#0E1211; --ink:#E3E8E5; --muted:#93A09A; --line:#2D3532;
  --accent:#8FA3FF; --accent-ink:#0C1233; --accent-soft:rgba(143,163,255,.14);
  --bad:#F2766B; --bad-soft:rgba(242,118,107,.14); --warn:#F5A35C; --warn-soft:rgba(245,163,92,.14);
  --good:#6FCB95; --good-soft:rgba(111,203,149,.14); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* header */
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:700;font-stretch:75%;letter-spacing:.01em;text-wrap:balance}
.brand small{font:400 11.5px var(--f-num);color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink);font:500 13px var(--f-ui);padding:7px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .cap{font:500 11px var(--f-ui);font-stretch:80%;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 4px 8px 10px;align-self:center}
.btn{font:500 13px var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chip{font:500 12px var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip:disabled{cursor:default}
.chip:not(:disabled){cursor:pointer;color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.chip.good:not(:disabled){color:var(--good);background:var(--good-soft);border-color:transparent}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;min-height:0}
#stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--stage);min-height:0}
#c{display:block;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font:500 11px var(--f-num);white-space:nowrap;padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.lbl.room{background:transparent;border:0;color:var(--on-floor);text-align:center;line-height:1.15;padding:0}
.lbl.room b{display:block;font:700 11.5px var(--f-ui);font-stretch:78%;text-transform:uppercase;letter-spacing:.08em}
.lbl.room span{font:400 10.5px var(--f-num);opacity:.8}
.lbl.void{background:transparent;border:0;color:var(--on-floor);font:400 10.5px var(--f-ui);opacity:.75}
.lbl.dim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbl.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translate(-50%,-140%)}
.lbl.measure{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:12px}
.hint{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
.hint p{margin:0;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:520px}
.hint .btn{pointer-events:auto}

/* panel */
#panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 12px var(--f-ui);font-stretch:85%;text-transform:uppercase;letter-spacing:.07em;padding:11px 6px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#pbody{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px;min-height:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font:600 11px var(--f-ui);font-stretch:80%;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.sec h3 span{font:400 11px var(--f-num);text-transform:none;letter-spacing:0}
.name{font:600 17px var(--f-ui);font-stretch:85%;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);padding:3px 6px;margin:-3px -6px;width:calc(100% + 12px)}
.name:hover{border-color:var(--line)}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-ui);padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11.5px;color:var(--muted)}
.fld input,.fld select{font:500 13px var(--f-num);border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.fld input[type=color]{padding:2px;height:32px}
.fld input[type=text]{font-family:var(--f-ui)}
.rot{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center}
.rot input{font:500 13px var(--f-num);border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);width:100%;min-width:0;text-align:center}
.note{font-size:12px;color:var(--muted);margin:0}
.status{border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:6px}
.status.good{background:var(--good-soft)} .status.bad{background:var(--bad-soft)} .status.warn{background:var(--warn-soft)}
.status ul{margin:0;padding-left:18px;font-size:12.5px}
.clear{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.clear div{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.clear b{font:500 13px var(--f-num);font-variant-numeric:tabular-nums}
.clear small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{flex-direction:row;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding-bottom:6px}
.actions{flex-direction:row;gap:8px}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.cat button:hover{border-color:var(--accent)}
.cat b{font:600 12.5px var(--f-ui);font-stretch:90%}
.cat span{font:400 10.5px var(--f-num);color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list button{display:flex;justify-content:space-between;gap:8px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 10px;text-align:left;cursor:pointer;font:500 12.5px var(--f-ui)}
.list button:first-child{border-top:0}
.list button:hover{background:var(--accent-soft)}
.list button span{font:400 11px var(--f-num);color:var(--muted);white-space:nowrap}
.list button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:1px}
.rooms{display:flex;flex-direction:column;gap:6px}
.rooms div{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.rooms span{font:400 12px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{display:flex;flex-direction:column;gap:10px}
.empty p{margin:0}
kbd{font:500 11px var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--bg)}
#loaderr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  html,body{height:auto}
  #app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  #stage{height:62vh;min-height:340px}
  #panel{max-height:none}
  .hint p{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <h1>Apartamento T1</h1>
      <small>A(PH) 45,60 m² · medidas da planta</small>
    </div>
    <div class="tools">
      <button class="chip" id="sync" disabled aria-live="polite">A ligar à disposição partilhada…</button>
      <div class="seg" role="group" aria-label="Vista">
        <button id="v-plan" aria-pressed="false">Planta</button>
        <button id="v-3d" aria-pressed="true">3D</button>
      </div>
      <div class="seg" role="group" aria-label="Paredes" id="wallseg">
        <span class="cap">Paredes</span>
        <button data-w="auto" aria-pressed="true">Auto</button>
        <button data-w="high" aria-pressed="false">Altas</button>
        <button data-w="low" aria-pressed="false">Baixas</button>
      </div>
      <button class="btn" id="b-measure" aria-pressed="false">Medir</button>
      <button class="btn" id="b-snap" aria-pressed="true" title="Encaixa a 5 cm e encosta às paredes">Íman</button>
      <button class="btn" id="b-undo" disabled title="Ctrl+Z">Desfazer</button>
      <button class="btn" id="b-redo" disabled title="Ctrl+Shift+Z">Refazer</button>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="c" aria-label="Modelo 3D do apartamento"></canvas>
      <div id="labels"></div>
      <div class="hint"><p id="hint"></p><button class="btn sm" id="b-recenter">Recentrar</button></div>
    </div>
    <aside id="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-peca" aria-selected="true">Peça</button>
        <button role="tab" id="t-add" aria-selected="false">Adicionar</button>
        <button role="tab" id="t-planta" aria-selected="false">Planta</button>
      </div>
      <div id="pbody"></div>
    </aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
if (!window.THREE || !THREE.OrbitControls) {
  document.getElementById('stage').insertAdjacentHTML('beforeend','<div id="loaderr">Não foi possível carregar o motor 3D. Verifica a ligação e recarrega a página.</div>');
  return;
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cm = m => Math.round(m * 100);
const fmt = m => { const a = Math.abs(m); return a < 0.995 ? Math.round(a * 100) + ' cm' : a.toFixed(2).replace('.', ',') + ' m'; };
const uid = () => 'i' + Math.random().toString(36).slice(2, 9);
THREE.ColorManagement.legacyMode = false;

/* ============================== DATA (plan coords, metres) ==============================
   Plan: x = from the entrance wall towards the living-room window; y = from the sofa/desk wall
   towards the bedroom. World: x = plan x, z = -plan y. Origin = kitchen corner by the trolley. */
const H = 2.6, CUT = 1.0;
/* Geometry from the annotated plan: living 2,70 m wide, bedroom 2,70 m wide, 2,07 m from the bedroom
   door to the windows, 1,06 m wall before the bedroom door, kitchen 17 cm short of the front door,
   75 × 90 cm storage closet, 81 cm vanity, windows 2,59 m and 2,56 m, bed 1,45 × 1,93 m. */
const ROOMS = [
  { name:'Sala e cozinha', floor:'oak',  rects:[[0,0,6.29,2.70],[0,2.70,2.13,3.60]], label:[3.25,1.95], dims:'6,29 × 2,70 m + entrada' },
  { name:'Quarto',         floor:'oak',  rects:[[3.25,2.85,6.29,5.55],[2.64,3.75,3.25,5.55]], label:[5.95,3.3], dims:'3,04 × 2,70 m + roupeiro' },
  { name:'Arrumos',        floor:'tile', rects:[[2.23,2.85,3.15,3.60]], label:[2.4,3.225], dims:'0,92 × 0,75 m (máquina e termo)', small:true },
  { name:'Casa de banho',  floor:'tile', rects:[[0,3.75,2.48,5.55]], label:[1.3,4.3], dims:'2,48 × 1,80 m' },
  { name:'Varanda',        floor:'deck', rects:[[6.47,0,7.47,5.55]], label:[6.97,2.78], dims:'5,55 × 1,00 m', outdoor:true },
];
const THRESH = [[0.95,3.60,1.75,3.75,'tile'],[3.29,2.70,4.19,2.85,'oak'],[-0.2,2.62,0,3.52,'oak'],[6.29,0.06,6.47,2.65,'deck'],[6.29,2.92,6.47,5.48,'deck']];
const WALLS = [
  { r:[-0.2,-0.2,7.47,0], ext:true },
  { r:[-0.2,0,0,5.55], ext:true, ops:[{a:2.62,b:3.52,head:2.1,kind:'door'}] },
  { r:[6.29,0,6.47,5.55], ext:true, facade:true, ops:[{a:0.06,b:2.65,sill:0,head:2.45,kind:'window'},{a:2.92,b:5.48,sill:0,head:2.45,kind:'window'}] },
  { r:[-0.2,5.55,7.47,5.75], ext:true },
  { r:[2.13,2.70,6.29,2.85], ops:[{a:3.29,b:4.19,head:2.1,kind:'door'}] },
  { r:[0,3.60,3.25,3.75], ops:[{a:0.95,b:1.75,head:2.1,kind:'door'}] },
  { r:[2.13,2.85,2.23,3.60], ops:[{a:2.88,b:3.57,head:2.1,kind:'door'}] },
  { r:[2.48,3.75,2.64,5.55] },
  { r:[2.16,5.25,2.48,5.55] },
  { r:[3.15,2.85,3.25,3.60] }, // wall between the utility closet and the bedroom entrance (behind the open bedroom door)
];
const DOORS = [
  { name:'Porta de entrada',       hinge:[0,3.52],    closed:[0,-1], swing:[1,0],  w:0.9, color:'#1E1F21', wall:1 },
  { name:'Porta da casa de banho', hinge:[0.95,3.75], closed:[1,0],  swing:[0,1],  w:0.8, color:'#C9A47C', wall:5 },
  { name:'Porta do quarto',        hinge:[3.29,2.85], closed:[1,0],  swing:[0,1],  w:0.9, color:'#C9A47C', wall:4 },
  { name:'Porta dos arrumos (máquina e termo)', hinge:[2.13,3.57], closed:[0,-1], swing:[-1,0], w:0.69, color:'#E7E4DE', wall:6 },
];
const APT_C = [3.63, 2.78];

/* ============================== RENDERER / SCENE ============================== */
const stage = $('#stage'), canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8a58a, 0.62));
scene.add(new THREE.AmbientLight(0xffffff, 0.12));
const sun = new THREE.DirectionalLight(0xfff6ea, 0.62);
sun.position.set(10.5, 14, 2.5); sun.target.position.set(3.9, 0, -3.3);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-7, right:7, top:7, bottom:-7, near:1, far:40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const BOX = new THREE.BoxGeometry(1, 1, 1);
const MC = {};
function M(c, o) { const k = c + (o ? JSON.stringify(o) : ''); return MC[k] || (MC[k] = new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:0.82, metalness:0 }, o || {}))); }
function bx(g, w, h, d, c, x, y, z, o) { const m = new THREE.Mesh(BOX, typeof c === 'string' ? M(c, o) : c); m.scale.set(w, h, d); m.position.set(x || 0, (y || 0) + h / 2, z || 0); g.add(m); return m; }
function cy(g, rt, rb, h, c, x, y, z, seg, o) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 32), typeof c === 'string' ? M(c, o) : c); m.position.set(x || 0, (y || 0) + h / 2, z || 0); g.add(m); return m; }
function shade(c, f) { const k = new THREE.Color(c); k.multiplyScalar(f); return '#' + k.getHexString(); }
const glassMat = new THREE.MeshStandardMaterial({ color:'#cfe3ea', transparent:true, opacity:0.28, roughness:0.05, metalness:0.1, depthWrite:false });

/* ---------- procedural textures ---------- */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function canvasTex(size, draw, repeatMeters) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.userData = { meters: repeatMeters }; return t;
}
const oakTex = canvasTex(1024, (g, S) => {
  const r = rng(7), pxm = S / 2.4, pw = 0.2;
  g.fillStyle = '#C39A6B'; g.fillRect(0, 0, S, S);
  for (let row = 0; row < 12; row++) {
    let x = -r() * 1.2;
    while (x < 2.4) {
      const len = 0.9 + r() * 0.7;
      g.fillStyle = `hsl(${30 + r() * 6},${38 + r() * 12}%,${56 + r() * 9}%)`;
